name: Java 25 Eclipse cleanup integration

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  java25-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build refactoring CLI
        run: mvn --no-transfer-progress -B package

      - name: Install Eclipse IDE 2026-09
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

          curl --fail --location --silent --show-error --retry 3 \
            "https://www.eclipse.org/downloads/download.php?file=/technology/epp/downloads/release/2026-09/R/eclipse-java-2026-09-R-linux-gtk-x86_64.tar.gz&r=1" \
            --output "$RUNNER_TEMP/eclipse.tar.gz"
          tar -xzf "$RUNNER_TEMP/eclipse.tar.gz" -C "$RUNNER_TEMP"

          plugin="$(find target -maxdepth 1 -type f -name 'io.github.nbauma109.refactoring.cli-*.jar' -print -quit)"
          if [ -z "$plugin" ]; then
            echo "No built refactoring-cli plugin JAR found in target/"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/eclipse/dropins"
          cp "$plugin" "$RUNNER_TEMP/eclipse/dropins/"

      - name: Refactor Java 25 flexible constructor body
        env:
          ECLIPSE_HOME: ${{ runner.temp }}/eclipse
        run: bash tests/java25/test-cleanup.sh
